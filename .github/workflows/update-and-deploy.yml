name: Atualizar e publicar FUTRanking

on:
  workflow_dispatch:
    inputs:
      visual_identity_audit:
        description: "Comparar escudos somente em candidatos ESPN × GSA"
        required: false
        default: false
        type: boolean
  schedule:
    # 00:15 em São Paulo (UTC-3)
    - cron: "15 3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restaurar banco persistente
        id: state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=futranking-data
          remote_ref=$(git ls-remote --heads origin "refs/heads/$branch")
          if [ -n "$remote_ref" ]; then
            git fetch origin "$branch"
            git worktree add -b "$branch" "$RUNNER_TEMP/futranking-state" FETCH_HEAD
            test -s "$RUNNER_TEMP/futranking-state/rankings.sqlite3"
            test -s "$RUNNER_TEMP/futranking-state/last-sync.txt"
            cp "$RUNNER_TEMP/futranking-state/rankings.sqlite3" data/rankings.sqlite3
            cp "$RUNNER_TEMP/futranking-state/last-sync.txt" data/last-sync.txt
          else
            git worktree add --detach "$RUNNER_TEMP/futranking-state" HEAD
            git -C "$RUNNER_TEMP/futranking-state" switch --orphan "$branch"
            PYTHONPATH=src python -m glicko_br.seed_site --database data/rankings.sqlite3
            echo 'Primeira execução: carregamento histórico completo.'
          fi
      - name: Montar ranking atualizado
        run: |
          set -euo pipefail
          export PYTHONPATH=src
          full=()
          if [ "$(date -u +%d)" = "01" ]; then full=(--full); fi
          started=$(date +%s)
          echo "[workflow] sincronização: início $(date -Is)"
          python -m glicko_br.sync_workflow --database data/rankings.sqlite3 --watermark data/last-sync.txt "${full[@]}"
          echo "[workflow] sincronização: concluída em $(( $(date +%s) - started ))s"
          started=$(date +%s)
          echo "[workflow] recálculo de ratings: início $(date -Is)"
          python -m glicko_br.cli process --database data/rankings.sqlite3
          echo "[workflow] recálculo de ratings: concluído em $(( $(date +%s) - started ))s"
          started=$(date +%s)
          echo "[workflow] exportação do site: início $(date -Is)"
          python -m glicko_br.export_site_data --database data/rankings.sqlite3 --output dist/data/ranking.json
          echo "[workflow] exportação do site: concluída em $(( $(date +%s) - started ))s"
      - name: Diagnóstico interno de cobertura
        run: |
          export PYTHONPATH=src
          python -m glicko_br.cli coverage --database data/rankings.sqlite3 --season "$(date -u +%Y)"
          python -m glicko_br.cli identities --database data/rankings.sqlite3
      - name: Auditoria visual opcional de identidades
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.visual_identity_audit }}
        run: |
          export PYTHONPATH=src
          python -m glicko_br.cli identities --database data/rankings.sqlite3 --crest-similarity
      - name: Salvar banco para a próxima execução
        shell: bash
        run: |
          set -euo pipefail
          cp data/rankings.sqlite3 "$RUNNER_TEMP/futranking-state/rankings.sqlite3"
          cp data/last-sync.txt "$RUNNER_TEMP/futranking-state/last-sync.txt"
          git -C "$RUNNER_TEMP/futranking-state" add -f rankings.sqlite3 last-sync.txt
          if ! git -C "$RUNNER_TEMP/futranking-state" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/futranking-state" commit -m "Atualizar banco FUTRanking"
            git -C "$RUNNER_TEMP/futranking-state" push origin futranking-data
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

