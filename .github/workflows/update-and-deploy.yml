name: Atualizar e publicar FUTRanking

on:
  workflow_dispatch:
  schedule:
    # 06:15 em São Paulo (UTC-3)
    - cron: "15 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Montar ranking atualizado
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          test -n "$FOOTBALL_DATA_TOKEN"
          export PYTHONPATH=src
          sync_season() {
            for attempt in 1 2 3; do
              python -m glicko_br.cli sync-football-data --database data/rankings.sqlite3 --season "$1" && return 0
              if [ "$attempt" -lt 3 ]; then
                echo "Limite temporário da API; nova tentativa em 60 segundos."
                sleep 60
              fi
            done
            return 1
          }
          for season in 2023 2024 2025 2026; do
            sync_season "$season"
          done
          python -m glicko_br.cli rebuild --database data/rankings.sqlite3
          python -m glicko_br.export_site_data --database data/rankings.sqlite3 --output dist/data/ranking.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

